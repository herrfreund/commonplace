<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commonplace Book</title>

  <!-- CSS: controls how the page looks -->
  <style>
    body {
      font-family: Georgia, serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
      background: #faf8f3;
      color: #222;
    }
    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }
    textarea, input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      font: inherit;
      margin-top: 4px;
    }
    button {
      margin-top: 16px;
      padding: 8px 20px;
      font: inherit;
      cursor: pointer;
    }
    .entry {
      position: relative; /* lets the delete icon sit in this box's corner */
      background: white;
      border: 1px solid #ddd;
      padding: 16px;
      padding-right: 48px; /* leaves room for the delete icon */
      margin-top: 16px;
    }
    .delete {
      position: absolute;
      top: 8px;
      right: 8px;
      margin: 0;
      padding: 4px 8px;
      background: none;
      border: none;
      font-size: 1.1em;
    }
    .passage {
      font-style: italic;
      white-space: pre-wrap; /* keeps line breaks from the pasted text */
    }
    .note {
      white-space: pre-wrap;
    }
    .meta {
      color: #777;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <!-- HTML: the parts of the page -->
  <h1>Commonplace Book</h1>

  <label for="passage">Passage</label>
  <textarea id="passage" rows="5"></textarea>

  <label for="note">My note</label>
  <textarea id="note" rows="3"></textarea>

  <label for="book">Book title</label>
  <input id="book" type="text">

  <button id="save">Save</button>

  <h2>Saved entries</h2>
  <p id="count"></p>
  <input id="search" type="search" placeholder="Search passages, notes and books">
  <div id="entries"></div>

  <!-- JavaScript: makes the page do things -->
  <script>
    // The name we store our entries under in the browser's storage.
    const STORAGE_KEY = "commonplace-entries";

    // Read the saved entries from the browser. If there are none yet, start with an empty list.
    function loadEntries() {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : [];
    }

    // Write the list of entries into the browser's storage.
    function saveEntries(entries) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    // Turn text into a list of lowercase words, dropping punctuation.
    // For example "Hello, World!" becomes ["hello", "world"].
    function splitIntoWords(text) {
      return text.toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(function (word) {
        return word !== "";
      });
    }

    // Count the fewest single-letter fixes needed to turn word a into word b.
    // A fix is adding a letter, removing one, changing one, or swapping two side-by-side letters.
    // This is called the "edit distance". For example "hapy" to "happy" is 1.
    function editDistance(a, b) {
      // d[i][j] will hold the number of fixes to turn the first i letters of a into the first j letters of b.
      const d = [];
      for (let i = 0; i <= a.length; i++) {
        d[i] = [i]; // turning i letters into nothing takes i removals
      }
      for (let j = 0; j <= b.length; j++) {
        d[0][j] = j; // turning nothing into j letters takes j additions
      }
      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          const change = a[i - 1] === b[j - 1] ? 0 : 1;
          d[i][j] = Math.min(
            d[i - 1][j] + 1,         // remove a letter
            d[i][j - 1] + 1,         // add a letter
            d[i - 1][j - 1] + change // change a letter (free if they already match)
          );
          // Swap two side-by-side letters, like "teh" to "the".
          if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
            d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
          }
        }
      }
      return d[a.length][b.length];
    }

    // How many typos we forgive in a search word. Short words must be exact,
    // otherwise "cat" would also find "car", "hat" and "cut".
    function allowedFixes(word) {
      if (/\d/.test(word)) return 0; // numbers (like years in the date) must be exact
      if (word.length <= 3) return 0;
      if (word.length <= 7) return 1;
      return 2;
    }

    // Does the search word match this word from an entry?
    // Yes if it's part of the word ("run" in "running") or close enough to count as a typo.
    function wordsAreClose(searchWord, entryWord) {
      if (entryWord.includes(searchWord)) {
        return true;
      }
      return editDistance(searchWord, entryWord) <= allowedFixes(searchWord);
    }

    // Draw the entries on the page, newest first.
    // If something is typed in the search box, only show entries that contain it.
    function showEntries() {
      const list = document.getElementById("entries");
      list.innerHTML = ""; // clear what's there before redrawing

      // What's in the search box, in lowercase so capital letters don't matter.
      const search = document.getElementById("search").value.trim().toLowerCase();
      const searchWords = splitIntoWords(search);
      let shown = 0; // how many entries we've drawn

      const entries = loadEntries();
      document.getElementById("count").textContent = "You have" + entries.length + "passages";
      
      // "index" is the entry's position in the list (0 for the first, 1 for the second, and so on).
      entries.forEach(function (entry, index) {
        // Gather all the entry's words, then check that every search word has a close match among them.
        const entryWords = splitIntoWords([entry.passage, entry.note, entry.book, entry.date].join(" "));
        const matches = searchWords.every(function (searchWord) {
          return entryWords.some(function (entryWord) {
            return wordsAreClose(searchWord, entryWord);
          });
        });
        if (!matches) {
          return; // skip this entry
        }
        shown++;

        const box = document.createElement("div");
        box.className = "entry";

        // The trash icon that deletes just this entry.
        const deleteButton = document.createElement("button");
        deleteButton.className = "delete";
        deleteButton.textContent = "🗑️";
        deleteButton.title = "Delete this entry";
        deleteButton.addEventListener("click", function () {
          deleteEntry(index);
        });

        const passage = document.createElement("p");
        passage.className = "passage";
        passage.textContent = entry.passage;

        const note = document.createElement("p");
        note.className = "note";
        note.textContent = entry.note;

        const meta = document.createElement("p");
        meta.className = "meta";
        meta.textContent = (entry.book || "Unknown book") + " · " + entry.date;

        box.append(deleteButton, passage, note, meta);
        list.append(box);
      });

      // If a search found nothing, say so instead of showing a blank space.
      if (search !== "" && shown === 0) {
        const message = document.createElement("p");
        message.className = "meta";
        message.textContent = "No entries match \"" + search + "\".";
        list.append(message);
      }
    }

    // Redraw the list every time something is typed in the search box.
    document.getElementById("search").addEventListener("input", showEntries);

    // Remove one entry, after checking with the user, since it can't be undone.
    function deleteEntry(index) {
      if (!confirm("Oof... struck a nerve there, did we?")) {
        return;
      }
      const entries = loadEntries();
      entries.splice(index, 1); // remove 1 item at this position
      saveEntries(entries);
      showEntries();
    }

    // What happens when Save is clicked.
    document.getElementById("save").addEventListener("click", function () {
      const passage = document.getElementById("passage").value.trim();
      const note = document.getElementById("note").value.trim();
      const book = document.getElementById("book").value.trim();

      // Don't save an empty passage.
      if (passage === "") {
        alert("Please paste a passage first.");
        return;
      }

      const entries = loadEntries();
      // Put the new entry at the front of the list so it shows first.
      entries.unshift({
        passage: passage,
        note: note,
        book: book,
        date: new Date().toLocaleString()
      });
      saveEntries(entries);

      // Empty the boxes, ready for the next entry.
      document.getElementById("passage").value = "";
      document.getElementById("note").value = "";
      document.getElementById("book").value = "";

      showEntries();
    });

    // Show any saved entries when the page first opens.
    showEntries();
  </script>
</body>
</html>
