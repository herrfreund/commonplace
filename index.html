<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commonplace Book</title>

  <!-- CSS: controls how the page looks -->
  <style>
    body {
      font-family: Georgia, serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
      background: #faf8f3;
      color: #222;
    }
    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }
    textarea, input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      font: inherit;
      margin-top: 4px;
    }
    button {
      margin-top: 16px;
      padding: 8px 20px;
      font: inherit;
      cursor: pointer;
    }
    #passage-count {
      margin: 4px 0 0; /* sit snugly under the passage box */
    }
    .form-buttons {
      display: flex; /* line the buttons up in a row */
      justify-content: space-between; /* first button on the left, last on the right */
    }
    .entry {
      position: relative; /* lets the delete icon sit in this box's corner */
      background: white;
      border: 1px solid #ddd;
      padding: 16px;
      padding-right: 48px; /* leaves room for the delete icon */
      margin-top: 16px;
    }
    .delete {
      position: absolute;
      top: 8px;
      right: 8px;
      margin: 0;
      padding: 4px 8px;
      background: none;
      border: none;
      font-size: 1.1em;
    }
    .passage {
      font-style: italic;
      white-space: pre-wrap; /* keeps line breaks from the pasted text */
    }
    .note {
      white-space: pre-wrap;
    }
    .meta {
      color: #777;
      font-size: 0.9em;
    }
    .resurface {
      background: #fff8e1; /* a warm yellow so it stands out from the saved list */
      border-color: #e6d28a;
      padding-right: 16px; /* no delete icon here, so no extra room needed */
    }
  </style>
</head>
<body>

  <!-- HTML: the parts of the page -->
  <h1>Commonplace Book</h1>

  <!-- A random past entry, picked each time the page opens. Hidden until there's one to show. -->
  <div id="resurface" class="entry resurface" hidden></div>

  <label for="passage">Passage</label>
  <textarea id="passage" rows="5"></textarea>
  <p id="passage-count" class="meta" hidden></p>

  <label for="note">My note</label>
  <textarea id="note" rows="3"></textarea>

  <label for="book">Book title</label>
  <input id="book" type="text">

  <div class="form-buttons">
    <button id="save">Save</button>
    <button id="clear">Clear</button>
  </div>

  <h2>Saved entries</h2>
  <p id="count"></p>
  <button id="download">Download backup</button>
  <input id="search" type="search" placeholder="Search passages, notes and books">
  <p id="search-status" class="meta"></p>
  <div id="entries"></div>

  <!-- JavaScript: makes the page do things -->
  <script>
    // The name we store our entries under in the browser's storage.
    const STORAGE_KEY = "commonplace-entries";

    // Read the saved entries from the browser. If there are none yet, start with an empty list.
    function loadEntries() {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : [];
    }

    // Write the list of entries into the browser's storage.
    function saveEntries(entries) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    // Turn text into a list of lowercase words, dropping punctuation.
    // For example "Hello, World!" becomes ["hello", "world"].
    function splitIntoWords(text) {
      return text.toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(function (word) {
        return word !== "";
      });
    }

    // Count the fewest single-letter fixes needed to turn word a into word b.
    // A fix is adding a letter, removing one, changing one, or swapping two side-by-side letters.
    // This is called the "edit distance". For example "hapy" to "happy" is 1.
    function editDistance(a, b) {
      // d[i][j] will hold the number of fixes to turn the first i letters of a into the first j letters of b.
      const d = [];
      for (let i = 0; i <= a.length; i++) {
        d[i] = [i]; // turning i letters into nothing takes i removals
      }
      for (let j = 0; j <= b.length; j++) {
        d[0][j] = j; // turning nothing into j letters takes j additions
      }
      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          const change = a[i - 1] === b[j - 1] ? 0 : 1;
          d[i][j] = Math.min(
            d[i - 1][j] + 1,         // remove a letter
            d[i][j - 1] + 1,         // add a letter
            d[i - 1][j - 1] + change // change a letter (free if they already match)
          );
          // Swap two side-by-side letters, like "teh" to "the".
          if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
            d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
          }
        }
      }
      return d[a.length][b.length];
    }

    // How many typos we forgive in a search word. Short words must be exact,
    // otherwise "cat" would also find "car", "hat" and "cut".
    function allowedFixes(word) {
      if (/\d/.test(word)) return 0; // numbers (like years in the date) must be exact
      if (word.length <= 3) return 0;
      if (word.length <= 7) return 1;
      return 2;
    }

    // Does the search word match this word from an entry?
    // Yes if it's part of the word ("run" in "running") or close enough to count as a typo.
    function wordsAreClose(searchWord, entryWord) {
      if (entryWord.includes(searchWord)) {
        return true;
      }
      return editDistance(searchWord, entryWord) <= allowedFixes(searchWord);
    }

    // Draw the entries on the page, newest first.
    // If something is typed in the search box, only show entries that contain it.
    function showEntries() {
      const list = document.getElementById("entries");
      list.innerHTML = ""; // clear what's there before redrawing

      // What's in the search box, in lowercase so capital letters don't matter.
      const search = document.getElementById("search").value.trim().toLowerCase();
      const searchWords = splitIntoWords(search);
      let shown = 0; // how many entries we've drawn

      const entries = loadEntries();
      if  (entries.length === 1){
        document.getElementById("count").textContent = "You have " + entries.length + " passage";
      }
      else{
        document.getElementById("count").textContent = "You have " + entries.length + " passages";
      }
      
      // "index" is the entry's position in the list (0 for the first, 1 for the second, and so on).
      entries.forEach(function (entry, index) {
        // Gather all the entry's words, then check that every search word has a close match among them.
        const entryWords = splitIntoWords([entry.passage, entry.note, entry.book, entry.date].join(" "));
        const matches = searchWords.every(function (searchWord) {
          return entryWords.some(function (entryWord) {
            return wordsAreClose(searchWord, entryWord);
          });
        });
        if (!matches) {
          return; // skip this entry
        }
        shown++;

        const box = document.createElement("div");
        box.className = "entry";

        // The trash icon that deletes just this entry.
        const deleteButton = document.createElement("button");
        deleteButton.className = "delete";
        deleteButton.textContent = "🗑️";
        deleteButton.title = "Delete this entry";
        deleteButton.addEventListener("click", function () {
          deleteEntry(index);
        });

        const passage = document.createElement("p");
        passage.className = "passage";
        passage.textContent = entry.passage;

        const note = document.createElement("p");
        note.className = "note";
        note.textContent = entry.note;

        const meta = document.createElement("p");
        meta.className = "meta";
        meta.textContent = (entry.book || "Unknown book") + " · " + entry.date;

        box.append(deleteButton, passage, note, meta);
        list.append(box);
      });

      // Under the search box, say how many passages match. Leave it blank when nothing is typed.
      const status = document.getElementById("search-status");
      if (search === "") {
        status.textContent = "";
      } else if (shown === 0) {
        status.textContent = "No passages match \"" + search + "\".";
      } else {
        const word = entries.length === 1 ? "passage" : "passages"; // "1 passage" but "2 passages"
        status.textContent = "Showing " + shown + " of " + entries.length + " " + word;
      }
    }

    // Redraw the list every time something is typed in the search box.
    document.getElementById("search").addEventListener("input", showEntries);

    // Remove one entry, after checking with the user, since it can't be undone.
    function deleteEntry(index) {
      if (!confirm("Oof... struck a nerve there, did we?")) {
        return;
      }
      const entries = loadEntries();
      entries.splice(index, 1); // remove 1 item at this position
      saveEntries(entries);
      showEntries();
    }

    // What happens when Save is clicked.
    document.getElementById("save").addEventListener("click", function () {
      const passage = document.getElementById("passage").value.trim();
      const note = document.getElementById("note").value.trim();
      const book = document.getElementById("book").value.trim();

      // Don't save an empty passage.
      if (passage === "") {
        alert("Please paste a passage first.");
        return;
      }

      const entries = loadEntries();
      // Put the new entry at the front of the list so it shows first.
      entries.unshift({
        passage: passage,
        note: note,
        book: book,
        date: new Date().toLocaleString()
      });
      saveEntries(entries);

      // Empty the boxes, ready for the next entry.
      document.getElementById("passage").value = "";
      document.getElementById("note").value = "";
      document.getElementById("book").value = "";

      showEntries();
    });

    // Write how many characters are in the passage box into the line underneath it.
    function updatePassageCount() {
      const length = document.getElementById("passage").value.length;
      const word = length === 1 ? "character" : "characters";
      document.getElementById("passage-count").textContent = length + " " + word;
    }

    const passageBox = document.getElementById("passage");
    const passageCount = document.getElementById("passage-count");

    // "focus" happens when the user clicks into the box: show the count.
    passageBox.addEventListener("focus", function () {
      updatePassageCount();
      passageCount.hidden = false;
    });

    // "input" happens on every change to the text, like a keystroke or a paste: update the count.
    passageBox.addEventListener("input", updatePassageCount);

    // "blur" happens when the user clicks away from the box: hide the count.
    passageBox.addEventListener("blur", function () {
      passageCount.hidden = true;
    });

    // What happens when Clear is clicked: empty the three boxes. Saved entries are left alone.
    document.getElementById("clear").addEventListener("click", function () {
      document.getElementById("passage").value = "";
      document.getElementById("note").value = "";
      document.getElementById("book").value = "";
    });

    // What happens when Download backup is clicked: save all entries to a file on this computer.
    document.getElementById("download").addEventListener("click", function () {
      const entries = loadEntries();
      if (entries.length === 0) {
        alert("There are no entries to back up yet.");
        return;
      }

      // Turn the entries into text. The extra "2" spaces it out so it's easy to read in a text editor.
      const text = JSON.stringify(entries, null, 2);

      // A "Blob" is a chunk of file data held in the browser's memory.
      const file = new Blob([text], { type: "application/json" });

      // Give the file a temporary address, then click an invisible link to it to start the download.
      const link = document.createElement("a");
      link.href = URL.createObjectURL(file);
      const today = new Date().toISOString().slice(0, 10); // like "2026-10-30"
      link.download = "commonplace-backup-" + today + ".json";
      link.click();

      // We're done with the temporary address, so let the browser free it.
      URL.revokeObjectURL(link.href);
    });

    // Pick one saved entry at random and show it at the top of the page.
    function showRandomEntry() {
      const entries = loadEntries();
      if (entries.length === 0) {
        return; // nothing saved yet, so leave the box hidden
      }

      // Math.random() gives a number from 0 up to (but not including) 1.
      // Multiplying by the number of entries and rounding down gives a position in the list.
      const entry = entries[Math.floor(Math.random() * entries.length)];

      const box = document.getElementById("resurface");

      const heading = document.createElement("p");
      heading.className = "meta";
      heading.textContent = "From your past";

      const passage = document.createElement("p");
      passage.className = "passage";
      passage.textContent = entry.passage;

      const note = document.createElement("p");
      note.className = "note";
      note.textContent = entry.note;

      const meta = document.createElement("p");
      meta.className = "meta";
      meta.textContent = (entry.book || "Unknown book") + " · " + entry.date;

      box.append(heading, passage, note, meta);
      box.hidden = false; // now that it has something in it, show it
    }

    // When the page first opens, resurface a random entry and show all saved entries.
    showRandomEntry();
    showEntries();
  </script>
</body>
</html>
